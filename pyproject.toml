[project]
name = "santander-cycles-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fahad Code", email = "tasinul.hoque@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "mlflow>=3.17.2",
    "pandas>=3.0.5",
    "uvicorn>=0.52.4",
]

[project.scripts]
santander-cycles-forecast = "santander_cycles_forecast:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
